spring.application.name=transactions

# A parent_id of 10.9 must be refused, not truncated to 10: truncating would silently link the
# transaction under a parent the client never named.
spring.jackson.deserialization.accept-float-as-int=false

# A misspelt field such as "parentId" must be refused, not ignored: ignoring it would store the
# transaction as a root, detaching it from the parent the client meant.
spring.jackson.deserialization.fail-on-unknown-properties=true
